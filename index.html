<style>
.inv-green{background:#e7f6ec;color:#1a7f37;border:1px solid #b7e1c3}
.inv-yellow{background:#fff6e5;color:#a86400;border:1px solid #ffdf9e}
.inv-red{background:#fdecec;color:#b3261e;border:1px solid #f4c0c0}
.stockchip{display:inline-block;margin:8px 0 2px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600}
.invq{width:110px;text-align:center;font-weight:600}
:root{--red:#d81f26;--ink:#1c1c1c;--line:#dcdcdc;--muted:#6b6b6b;--bg:#f4f4f6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
.top{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:9px}
.top .mark{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:700}
.top b{font-size:16px;font-weight:600}
.tabs{position:sticky;top:50px;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto}
.tabbtn{flex:0 0 auto;border:0;background:none;padding:11px 15px;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent}
.tabbtn.on{color:var(--red);border-bottom-color:var(--red);font-weight:600}
#view{max-width:820px;margin:0 auto;padding:12px 12px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:9px}
input,select{width:100%;height:40px;border:1px solid #cfcfcf;border-radius:8px;padding:0 10px;font-size:15px;color:var(--ink);background:#fff;margin-top:4px}
input:focus,select:focus{outline:none;border-color:var(--red)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:#aaa;font-weight:400}
.prefill{background:#faf7f7;border:1px solid #f0e2e2;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#555;margin-top:2px}
.prefill.muted{background:#f7f7f7;border-color:#eee;color:#999}
.secttl{display:flex;align-items:center;margin:16px 2px 8px}
.secttl span{font-size:14px;font-weight:600}
.mini{margin-left:auto;background:#fff;color:var(--red);border:1px solid #f0999b;border-radius:8px;padding:7px 12px;font-size:13px}
.line .lhead{display:flex;align-items:center;margin-bottom:8px}
.lidx{font-size:11px;color:#999}
.del{margin-left:auto;background:none;border:0;color:#c33;font-size:17px}
.grid8{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.f8{font-size:11px;color:var(--muted);margin:0}
.f8 input{height:38px}
.f8 input[readonly]{background:#f1f2f4;color:#555;border-color:#e4e6ea;cursor:default}
.stepper{display:flex;align-items:center;gap:5px;margin-top:4px}
.stepper input{width:auto;flex:1;height:38px;margin-top:0;text-align:center;padding:0}
.stepper button{width:32px;height:38px;flex:0 0 auto;border:1px solid #cfcfcf;border-radius:8px;background:#fff;font-size:17px;line-height:1;color:var(--ink)}
.stepper button:active{background:#f2f2f2}
.lfoot{display:flex;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid #eee}
.lfoot b{margin-left:auto;font-size:16px}
.muted{color:var(--muted)}
.tots .cdrow{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--ink);margin-bottom:6px}
.tots .cdrow span{display:flex;align-items:center;gap:6px;color:var(--muted)}
.tots .cdrow input{margin:0;height:34px}
.tt{width:100%;border-collapse:collapse;font-size:14px}
.tt td{padding:5px 2px}.tt td:last-child{text-align:right}
.tt .net td{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:9px}
.tt .net td:last-child{color:var(--red)}
.actions{display:flex;gap:9px;margin-top:6px;flex-wrap:wrap}
button.primary{background:var(--red);color:#fff;border:0;border-radius:9px;padding:12px 16px;font-size:15px;font-weight:600;flex:1;min-width:150px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.ghost{background:#fff;border:1px solid #cfcfcf;border-radius:9px;padding:12px 15px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.filelbl{margin:0;color:var(--ink);cursor:pointer}
.list{width:100%;border-collapse:collapse;font-size:13.5px}
.list th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;padding:6px 6px;border-bottom:1px solid var(--line)}
.list td{padding:8px 6px;border-bottom:1px solid #f0f0f0;vertical-align:top}
.list .r,.list th.r{text-align:right}
.list .sub{font-size:11px;color:#999;margin-top:2px}
.icon{background:none;border:0;color:#777;font-size:16px;padding:4px}
.empty{text-align:center;color:var(--muted);padding:26px}
#modal,#preview{position:fixed;inset:0;z-index:20;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.45);overflow:auto}
#modal.show,#preview.show{display:flex}
.mbox{background:#fff;border-radius:14px;padding:16px;max-width:460px;width:calc(100% - 24px);margin:24px auto}
.mbox h3{margin:0 0 12px;font-size:17px}
.ml{font-size:12px;color:var(--muted)}
.mact{display:flex;gap:9px;margin-top:14px}.mact .primary,.mact .ghost{flex:1}
.pvwrap{margin:14px auto;width:100%}
.pvbar{max-width:210mm;margin:0 auto 10px;display:flex;gap:9px;justify-content:flex-end;padding:0 6px}
.pvbar button{border-radius:9px;padding:11px 17px;font-size:14px;border:0}
.pvbar .close{background:#fff;border:1px solid #cfcfcf}
.pvbar .print{background:var(--red);color:#fff;font-weight:600}
/* invoice sheet */
#sheet{width:210mm;min-height:297mm;max-width:calc(100vw - 12px);margin:0 auto;background:#fff;position:relative;
  padding:12mm 10mm 9mm;box-shadow:0 3px 18px rgba(0,0,0,.25);overflow:hidden;box-sizing:border-box}
#sheet>*{position:relative;z-index:1}
.ihead{display:flex;align-items:flex-start;gap:12px;border-bottom:2px solid var(--red);padding-bottom:8px}
.ihead .logo{width:108px;height:auto}
.co h1{margin:0;font-size:21px;color:var(--red);letter-spacing:.4px}
.co .sub{font-size:10.5px;color:#555;margin-top:2px;line-height:1.5}
.ids{margin-left:auto;text-align:right;font-size:10px;line-height:1.6;white-space:nowrap}
.ititle{text-align:center;font-size:12.5px;font-weight:700;letter-spacing:3px;margin:8px 0 6px}
.iparty{display:flex;border:1px solid #8a8a8a}
.iparty>div{padding:7px 10px;font-size:11px;line-height:1.55}
.iparty .to{flex:1;border-right:1px solid #8a8a8a}
.iparty .meta{width:44%}
.iparty .meta table{width:100%}.iparty .meta td{padding:2px 0}
.lbl{color:#666;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px}
.r{text-align:right}.l{text-align:left}
.items{width:100%;border-collapse:collapse;margin-top:8px;font-size:10px}
.items th,.items td{border:1px solid #8a8a8a;padding:4px 4px;text-align:center}
.items th{background:#f3d9da;font-size:9px;font-weight:700}
.items tbody tr:nth-child(even){background:rgba(0,0,0,.02)}
.itot{display:flex;gap:12px;margin-top:8px}
.words{flex:1;border:1px solid #8a8a8a;padding:8px 10px;font-size:11px}
.itot .tt{width:52%;font-size:11px}
.itot .tt td{border:1px solid #8a8a8a;padding:4px 8px}
.itot .tt .net td{font-size:13px;background:#f3d9da;color:#000}
.ifoot{display:flex;justify-content:space-between;gap:16px;margin-top:13px;font-size:9.5px;color:#555}
.terms{flex:1;line-height:1.7}
.sign{width:220px;text-align:center;align-self:flex-end}
.sign .for{font-weight:700;color:#000;font-size:11px;margin-bottom:2px}
.sign .sig{display:block;width:auto;height:46px;margin:2px auto 0;object-fit:contain}
.sign .ln{border-top:1px solid var(--ink);padding-top:3px}
.ilegal{margin-top:9px;border-top:1px solid #8a8a8a;padding-top:6px;text-align:center;font-size:9.5px;letter-spacing:.3px}
.helpbtn{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:50%;width:28px;height:28px;flex:0 0 auto;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.helpbtn:active{background:rgba(255,255,255,.3)}
.icon.danger{color:#c33}
.icon+.icon{margin-left:6px}
.tutstep{margin-bottom:13px}
.tutstep b{display:block;font-size:13.5px;margin-bottom:2px}
.tutstep p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
#tourveil{position:fixed;inset:0;z-index:59;display:none}
#tourhi{position:fixed;z-index:60;display:none;border:2px solid var(--red);border-radius:9px;box-shadow:0 0 0 9999px rgba(0,0,0,.6);pointer-events:none;transition:all .25s ease}
#tourbox{position:fixed;z-index:61;display:none;background:#fff;border-radius:12px;padding:13px;width:270px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:all .25s ease}
#tourbox .tb-n{font-size:10.5px;color:#999;letter-spacing:.3px;text-transform:uppercase}
#tourbox b{display:block;font-size:14px;margin-top:3px}
#tourbox p{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.tb-act{display:flex;gap:6px;margin-top:11px}
.tb-act button{flex:1;padding:8px 6px;font-size:12.5px;border-radius:8px}
.tb-act .ghost{border:1px solid #cfcfcf;background:#fff}
.tb-act .primary{background:var(--red);color:#fff;border:0;font-weight:600}
@media print{
  html,body{background:#fff;margin:0;padding:0;height:auto}
  .top,.tabs,#view,#modal,.pvbar{display:none!important}
  #preview{position:static!important;display:block!important;inset:auto;background:#fff;overflow:visible}
  .pvwrap{margin:0!important;width:auto}
  #sheet{width:210mm;min-height:297mm;max-width:none;margin:0;box-shadow:none;padding:10mm;box-sizing:border-box}
  @page{size:A4 portrait;margin:0}
  #tourveil,#tourhi,#tourbox{display:none!important}
}

html,body{background:linear-gradient(180deg,#eef1f5,#e7ebf1) fixed;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.top{background:linear-gradient(120deg,var(--red),var(--red-d));padding:12px 16px;gap:11px;box-shadow:0 2px 14px rgba(179,20,27,.30)}
.top .mark{width:34px;height:34px;border-radius:9px;background:#fff center/76% no-repeat;background-image:var(--logo-ico);color:transparent;font-size:0;box-shadow:0 1px 5px rgba(0,0,0,.22)}
.top b{font-size:16.5px;letter-spacing:.2px}
.tabs{top:58px;gap:3px;padding:7px 9px;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(7px);border-bottom:1px solid var(--line)}
.tabbtn{padding:8px 14px;border-radius:999px;font-weight:500;border-bottom:0}
.tabbtn.on{background:var(--red-soft);color:var(--red-d);border-bottom-color:transparent}
#view{padding:14px 12px 72px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06)}
input,select{height:42px;border:1px solid #d7dbe2;border-radius:10px;padding:0 12px;margin-top:5px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.secttl span{font-size:14.5px;font-weight:700;letter-spacing:.2px}
.mini{background:var(--red-soft);color:var(--red-d);border:1px solid #f4b8ba;border-radius:9px;font-weight:600}
.prefill{background:var(--red-soft);border:1px solid #f4d3d4;border-radius:10px;padding:9px 12px;color:#7a2e30;margin-top:6px}
.prefill.muted{background:#f6f7f9;border-color:#e9ebef;color:#8a8f98}
.line{border-left:3px solid var(--red-soft)}
.lfoot{border-top:1px solid #eef0f3}
.lfoot b{margin-left:auto;font-size:17px;color:var(--red-d);font-weight:700}
.lidx{color:#9aa0a8;font-weight:600}
.stepper button{border:1px solid #d7dbe2;border-radius:9px}
.tots{background:linear-gradient(180deg,#fff,#fcfcfd)}
.tt .net td{font-size:18px}
button.primary{background:linear-gradient(120deg,var(--red),var(--red-d));border-radius:11px;padding:13px 16px;box-shadow:0 3px 12px rgba(179,20,27,.30)}
button.primary:active{transform:translateY(1px)}
.ghost{border:1px solid #d7dbe2;border-radius:11px}
.ghost:active{background:#f5f6f8}
.list th{font-size:11px;letter-spacing:.4px;text-transform:uppercase;padding:8px 8px;border-bottom:1px solid var(--line)}
.list td{padding:10px 8px;border-bottom:1px solid #eef0f3}
.list tr:hover td{background:#fafbfc}
.icon{border-radius:8px}.icon:active{background:#f0f1f3}
.mbox{border-radius:16px;box-shadow:0 20px 60px rgba(16,24,40,.30)}
.empty{padding:32px}
@media print{ .top,.tabs{box-shadow:none} }


.helpwrap{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:2px}
.helpwrap .helpbtn{margin-left:0}
.helplbl{font-size:9px;color:#fff;opacity:.95;line-height:1;letter-spacing:.3px}

/* ---- mobile-friendly / anti-overflow ---- */
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
input,select,textarea{min-width:0;max-width:100%}
.stepper{min-width:0}
.stepper input{min-width:0;width:100%;flex:1 1 auto}
.grid8 input{min-width:0;width:100%}
.row2{min-width:0}.row2>*{min-width:0}
.invq{max-width:100%}
table.list{width:100%}
table.list td,table.list th{word-break:break-word}
@media (max-width:520px){
  table.list{display:block}
  table.list th,table.list td{display:block;width:auto}
  table.list tr{display:block;width:100%}
  table.list tr.lhead{display:none}
  table.list tr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;box-sizing:border-box}
  table.list td{border:none;padding:3px 0}
  table.list td[data-label]{display:flex;justify-content:space-between;gap:10px;text-align:right}
  table.list td[data-label]::before{content:attr(data-label);color:var(--muted);font-size:11px;text-align:left}
  table.list td:first-child{font-weight:600;font-size:14px;padding-bottom:6px}
  table.list td:first-child .sub{font-weight:400}
  table.list td:last-child{display:flex;justify-content:flex-end;gap:16px;padding-top:8px;margin-top:4px;border-top:1px solid #f0f0f0}
  table.list.stocktbl td:last-child{display:block;padding-top:6px;margin-top:0;border-top:none}
}
@media (max-width:520px){
  #view{padding:12px 10px 84px}
  .card{padding:12px}
  .grid8{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .f8{font-size:11px}
  input,select{font-size:16px}
  .f8 input,.stepper input,.stepper button{height:42px}
  .stepper button{width:34px}
  .actions{flex-direction:column;gap:8px}
  .actions>button,.actions>.primary,.actions>.ghost,.actions>label{width:100%;min-width:0;flex:1 1 auto}
  button.primary{min-width:0}
  .mbox{width:calc(100% - 16px);padding:14px;margin:14px auto}

  .top{padding:11px 12px}
  .list{font-size:12.5px}.list td,.list th{padding:7px 5px}
  .invq{width:100%}
}
@media (max-width:360px){
  .grid8{grid-template-columns:1fr 1fr;gap:6px}
  .f8 input{padding:0 8px}
}

/* ---------- cloud API (Cloudflare D1 via Pages Functions) ---------- */
const API='/api';
async function apiGet(path){const r=await fetch(API+path);if(!r.ok)throw new Error('GET '+path+' failed');return r.json();}
async function apiSend(method,path,body){const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(method+' '+path+' failed');return r.json();}
function cloudPush(fn){fn().catch(e=>console.warn('Cloud sync skipped (offline or error):',e.message));}
function apiTable(key){return key===K.P?'products':key===K.T?'parties':key===K.MF?'manufacturers':null;}
async function cloudSync(){
  try{
    const [pr,pt,mf,iv]=await Promise.all([apiGet('/products'),apiGet('/parties'),apiGet('/manufacturers'),apiGet('/invoices')]);
    if(pr&&pr.products)s(K.P,pr.products);
    if(pt&&pt.parties)s(K.T,pt.parties);
    if(mf&&mf.manufacturers)s(K.MF,mf.manufacturers);
    if(iv&&iv.invoices)s(K.I,iv.invoices);
    if(tab!=='bill')render(); // avoid disrupting an in-progress bill on the New Bill screen
  }catch(e){console.warn('Cloud sync failed, using local data:',e.message);}
}
async function manualSync(){await cloudSync();render();alert('Synced with cloud.');}

/* one-time: turn free-text product.mfr into linked Manufacturer records */
function migrateManufacturers(){
  if(localStorage.getItem(K.MF))return;
  const ps=g(K.P,[]);
  const mfs=[];
  const findOrCreate=name=>{
    name=(name||'').trim();
    if(!name)return'';
    let m=mfs.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!m){m={id:uid(),name,addr:'',gstin:'',dl:'',phone:''};mfs.push(m)}
    return m.id;
  };
  ps.forEach(p=>{p.mfrId=findOrCreate(p.mfr);delete p.mfr});
  s(K.MF,mfs);
  s(K.P,ps);
}

/* ---------- helpers ---------- */
const r3=x=>Math.round((Number(x)||0)*1000)/1000;
const money=x=>(Number(x)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:3});
const todayISO=()=>{const d=new Date();return d.toISOString().slice(0,10)};
const fmtDate=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-');return`${d}/${m}/${y}`};
function dmyInput(el){let v=el.value.replace(/\D/g,'').slice(0,8);let o=v;if(v.length>4)o=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(v.length>2)o=v.slice(0,2)+'/'+v.slice(2);el.value=o;}
function isoToDMY(iso){if(!iso||iso.indexOf('-')<0)return iso||'';const[y,m,d]=iso.split('-');return`${d}/${m}/${y}`;}
function dmyToISO(dmy){const m=String(dmy).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return'';return`${m[3]}-${m[2]}-${m[1]}`;}
function billDateInput(el){dmyInput(el);const iso=dmyToISO(el.value);if(iso)bill.date=iso;}
function anyToISO(v){if(!v)return'';v=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(m)return`${m[3]}-${m[2]}-${m[1]}`;return'';}
function dateFld(i,k,lab,val){return`<label class="f8">${lab}<input type="date" value="${anyToISO(val)}" oninput="setLine(${i},'${k}',this.value)"></label>`;}
function toMonthISO(v){if(!v)return'';v=String(v).trim();let m;
  if(/^\d{4}-\d{2}$/.test(v))return v;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v.slice(0,7);
  m=v.match(/^(\d{2})\/(\d{4})$/);if(m)return m[2]+'-'+m[1];
  m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(m)return m[3]+'-'+m[2];
  m=v.match(/^(\d{2})\/(\d{2})$/);if(m)return '20'+m[2]+'-'+m[1];
  return'';}
function myDisplay(v){if(!v)return'';v=String(v).trim();let m;
  if(/^\d{4}-\d{2}/.test(v)){const p=v.split('-');return p[1]+'/'+p[0];}
  if(/^\d{2}\/\d{4}$/.test(v))return v;
  m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(m)return m[2]+'/'+m[3];
  m=v.match(/^(\d{2})\/(\d{2})$/);if(m)return m[1]+'/20'+m[2];
  return v;}
function roFld(lab,val){return`<label class="f8">${lab}<input value="${esc(String(val==null?'':val))}" readonly tabindex="-1"></label>`;}
function nextInvoice(last){
  const m=String(last||'').match(/^(\D*)(\d+)(.*)$/);
  if(!m)return last||'SP-1/26';
  const n=String(Number(m[2])+1).padStart(m[2].length,'0');
  return m[1]+n+m[3];
}

function suggestAbbr(name){
  const w=String(name||'').trim().split(/\s+/).filter(Boolean);
  let a='';
  if(w.length>=2)a=(w[0][0]||'')+(w[1][0]||'');
  else if(w.length===1)a=w[0].slice(0,2);
  return a.toUpperCase();
}
function nextNoForAbbr(abbr){
  if(!abbr)return 1;
  const esc=abbr.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('^'+esc+'-(\\d+)','i');
  let max=0;
  g(K.I,[]).forEach(b=>{const m=String(b.invoiceNo).match(re);if(m){const n=+m[1];if(n>max)max=n}});
  return max+1;
}
function yy(){return (bill&&bill.date?bill.date:todayISO()).slice(2,4);}

  render();
}
function inWords(num){
  num=Math.round(num*100)/100;
  const rup=Math.floor(num), pai=Math.round((num-rup)*100);
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(n){return n<20?a[n]:b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'')}
  function three(n){return(n>=100?a[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):'')}
  function inr(n){
    if(n===0)return'Zero';
    let str='',cr=Math.floor(n/10000000);n%=10000000;
    let la=Math.floor(n/100000);n%=100000;
    let th=Math.floor(n/1000);n%=1000;
    let hu=n;
    if(cr)str+=three(cr)+' Crore ';
    if(la)str+=two(la)+' Lakh ';
    if(th)str+=two(th)+' Thousand ';
    if(hu)str+=three(hu);
    return str.trim();
  }
  let w='Rupees '+inr(rup);
  if(pai)w+=' and '+two(pai)+' Paise';
  return w+' Only';
}

/* ---------- current bill state ---------- */
let bill=null;
function newBill(){
  const set=g(K.S,{});
  bill={invoiceNo:nextInvoice(set.lastInvoice),date:todayISO(),partyId:'',cd:2,lines:[]};
  addLine();
}
function addLine(){bill.lines.unshift({productId:'',name:'',packing:'',hsn:'',tax:5,mrp:0,bno:'',mfg:'',exp:'',qty:0,free:0,ptr:0,pts:0})}
function isRetailer(){const p=g(K.T,[]).find(x=>x.id===bill.partyId);return !!(p&&String(p.type).toLowerCase()==='retailer')}
function billRate(l){return isRetailer()?(Number(l.ptr)||0):(Number(l.pts)||0)}
function calc(){
  let gross=0;bill.lines.forEach(l=>{l.total=r3((Number(l.qty)||0)*billRate(l));gross+=l.total});
  gross=r3(gross);
  const cd=r3(gross*(isRetailer()?0:(Number(bill.cd)||0))/100);
  const sub=r3(gross-cd);
  const cgst=r3(sub*0.025), sgst=r3(sub*0.025);
  const net=r3(sub+cgst+sgst);
  return{gross,cd,sub,cgst,sgst,net};
}

function lineCard(l,i){
  const prods=g(K.P,[]).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const opts=prods.map(x=>`<option value="${x.id}" ${x.id===l.productId?'selected':''}>${esc(x.name)} — ${esc(x.packing)}</option>`).join('');
  return `<div class="card line">
    <div class="lhead"><span class="lidx">Line ${i+1}</span>
      <button class="del" onclick="removeLine(${i})">Remove</button></div>
    <select onchange="pickProduct(${i},this.value)">
      <option value="">— select product —</option>${opts}
    </select>
    <div class="grid8">
      ${roFld('B.No',l.bno)}
      ${roFld('Mfg',myDisplay(l.mfg))}
      ${roFld('Exp',myDisplay(l.exp))}
      ${roFld('HSN',l.hsn)}
      ${stepFld(i,'qty','Qty',l.qty)}
      ${stepFld(i,'free','Free',l.free)}
      ${roFld('PTR',l.ptr)}
      ${roFld('PTS',l.pts)}
      ${fld(i,'mrp','MRP','number',l.mrp)}
      ${roFld('Tax %',l.tax)}
    </div>
    ${l.productId?(()=>{const si=stockInfo(l);return `<div class="stockchip ${si.cls}" id="sc-${i}">${si.text}</div>`;})():''}
    <div class="lfoot"><span class="muted" id="lm-${i}">Rate ₹${money(billRate(l))} ${isRetailer()?'(PTR)':'(PTS)'}</span><b id="lt-${i}">₹${money(r3((l.qty||0)*billRate(l)))}</b></div>
  </div>`;
}
function fld(i,k,lab,type,val){
  return `<label class="f8">${lab}<input type="${type}" ${type==='number'?'step="0.01"':''} value="${val??''}" oninput="setLine(${i},'${k}',this.value)"></label>`;
}
function stepFld(i,k,lab,val){
  return `<label class="f8">${lab}<div class="stepper">
    <button type="button" onclick="stepLine(${i},'${k}',-1)">−</button>
    <input type="number" step="1" value="${val??0}" oninput="setLine(${i},'${k}',this.value)">
    <button type="button" onclick="stepLine(${i},'${k}',1)">+</button>
  </div></label>`;
}
function setLine(i,k,v){bill.lines[i][k]=v;recalc()}
function stepLine(i,k,d){
  const cur=Number(bill.lines[i][k])||0;
  bill.lines[i][k]=Math.max(0,cur+d);
  render();
}
function removeLine(i){
  bill.lines.splice(i,1);
  if(!bill.lines.length)addLine();
  render();
}
function pickProduct(i,id){
  const p=g(K.P,[]).find(x=>x.id===id);
  const l=bill.lines[i];l.productId=id;
  if(p){l.name=p.name;l.packing=p.packing;l.hsn=p.hsn;l.tax=p.tax;l.mrp=p.mrp;l.ptr=p.ptr;l.pts=p.pts;l.bno=p.bno||'';l.mfg=p.mfd||'';l.exp=p.exp||''}
  render();
}
function recalc(){
  const t=calc();
  bill.lines.forEach((l,i)=>{const c=document.getElementById('lt-'+i);if(c)c.textContent='₹'+money(l.total);const lm=document.getElementById('lm-'+i);if(lm)lm.textContent='Rate ₹'+money(billRate(l))+(isRetailer()?' (PTR)':' (PTS)');const sc=document.getElementById('sc-'+i);if(sc&&l.productId){const si=stockInfo(l);sc.textContent=si.text;sc.className='stockchip '+si.cls;}});
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set('t-gross',money(t.gross));set('t-cd','− '+money(t.cd));set('t-sub',money(t.sub));
  set('t-cgst',money(t.cgst));set('t-sgst',money(t.sgst));set('t-net','₹'+money(t.net));
}

}
function stockInfo(l){
  const p=g(K.P,[]).find(x=>x.id===l.productId);
  const stock=p?Number(p.stock)||0:0;
  const used=(Number(l.qty)||0)+(Number(l.free)||0);
  const rem=stock-used;
  return {cls:stockClass(rem,stock), text: stock<=0?'No stock':(rem<0?`Short by ${-rem} · in stock ${stock}`:`In stock ${stock} · left after this ${rem}`)};
}

async function doBackup(){
  await cloudSync().catch(()=>{}); // best effort — if offline, backs up whatever is local
  const data={products:g(K.P,[]),parties:g(K.T,[]),manufacturers:g(K.MF,[]),invoices:g(K.I,[]),settings:g(K.S,{})};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download='care-labs-backup-'+todayISO()+'.json';a.click();
}
function doRestore(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);
    if(d.products)s(K.P,d.products);if(d.parties)s(K.T,d.parties);
    if(d.manufacturers)s(K.MF,d.manufacturers);
    if(d.invoices)s(K.I,d.invoices);if(d.settings)s(K.S,d.settings);
    alert('Restored.');render();}catch(e){alert('Invalid backup file.')}};
  rd.readAsText(f);
}

/* ---------- validation + save ---------- */
function validate(){
  const e=[];
  if(!bill.invoiceNo.trim())e.push('Invoice number is empty');
  if(!bill.partyId)e.push('No buyer selected');
  bill.lines.forEach((l,idx)=>{
    const hasData=(+l.qty>0)||(+l.pts>0)||l.bno;
    if(hasData&&!(l.productId||l.name))e.push('Line '+(idx+1)+': select a product');
  });
  const real=bill.lines.filter(l=>l.productId||l.name);
  if(!real.length)e.push('Add at least one product');
  real.forEach(l=>{
    const nm=l.name||'A line';
    if(!(+l.qty>0))e.push(nm+': qty must be greater than 0');
    if(!(+l.pts>0))e.push(nm+': PTS must be greater than 0');
    if(!l.bno)e.push(nm+': batch no is missing');
  });
  const dup=g(K.I,[]).some(b=>b.invoiceNo===bill.invoiceNo);
  if(dup)e.push('Invoice number '+bill.invoiceNo+' is already used');
  return e;
}
function doSave(print){
  const errs=validate();
  if(errs.length){alert('Please fix these first:\n\n• '+errs.join('\n• '));return}
  const parties=g(K.T,[]);const p=parties.find(x=>x.id===bill.partyId);
  const rec=JSON.parse(JSON.stringify(bill));
  rec.id=rec.id||uid();
  rec.lines=rec.lines.filter(l=>l.productId||l.name).slice().reverse();
  rec.party={name:p.name,type:p.type||'Distributor',addr:p.addr,gstin:p.gstin,pan:p.pan,dl:p.dl,phone:p.phone};
  rec.totals=calc();
  const iv=g(K.I,[]);iv.push(rec);s(K.I,iv);
  const set=g(K.S,{});set.lastInvoice=rec.invoiceNo;s(K.S,set);
  const ps=g(K.P,[]);
  rec.lines.forEach(l=>{const i=ps.findIndex(x=>x.id===l.productId);if(i>=0)ps[i].stock=Math.max(0,(Number(ps[i].stock)||0)-((Number(l.qty)||0)+(Number(l.free)||0)));});
  s(K.P,ps);
  cloudPush(()=>apiSend('POST','/invoices',rec));
  newBill();tab='bill';render();
  if(print)openPreview(rec,true);
  else alert('Saved bill '+rec.invoiceNo);
}

/* ---------- preview / invoice ---------- */
function viewBill(){
  const parties=g(K.T,[]);const p=parties.find(x=>x.id===bill.partyId);
  if(!p){alert('Select a buyer first');return}
  const lines=bill.lines.filter(l=>(l.productId||l.name)&&(+l.qty>0)).slice().reverse();
  if(!lines.length){alert('Add at least one product with a quantity');return}
  const rec=JSON.parse(JSON.stringify(bill));
  rec.lines=lines;
  rec.party={name:p.name,type:p.type||'Distributor',addr:p.addr,gstin:p.gstin,pan:p.pan,dl:p.dl,phone:p.phone};
  rec.totals=calc();
  openPreview(rec,false);
}
function slug(x){return String(x||'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toUpperCase()}
function openPreview(b,autoPrint){
  document.title=`${slug(b.invoiceNo)}__${slug(b.party.name).slice(0,28)}__${b.date}`;
  document.getElementById('sheet').innerHTML=invoiceHTML(b);
  document.getElementById('preview').classList.add('show');
  if(autoPrint)setTimeout(()=>window.print(),250);
}
function closePreview(){document.getElementById('preview').classList.remove('show');document.title='Care Laboratories — Billing'}

/* ---------- modal ---------- */
function modal(html){document.getElementById('modalbody').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function mInput(id,lab,val,type){return`<label class="ml">${lab}<input id="${id}" type="${type||'text'}" ${type==='number'?'step="0.01"':''} value="${val??''}"></label>`}

/* ---------- tutorial / help ---------- */
const TUT_SEEN_KEY='care_tutorial_seen';
function tutStep(title,body){return`<div class="tutstep"><b>${title}</b><p>${body}</p></div>`}
function showTutorial(){
  localStorage.setItem(TUT_SEEN_KEY,'1');
  modal(`<h3>How to use this app</h3>
    ${tutStep('1. Set up your lists first','Go to <b>Manufacturers</b> and add who you buy from, then <b>Products</b> (pick a manufacturer for each), then <b>Parties</b> for your buyers. You only do this once per item — after that, just pick from the dropdown.')}
    ${tutStep('2. Create a bill','In <b>New bill</b>, pick a buyer, then Add product for each item. Selecting a product fills in packing, HSN, MRP, PTR and PTS for you — just fill in batch no, dates, qty and free.')}
    ${tutStep('3. Remove a line from a bill','The trash icon on a line removes just that line from the current bill. To delete a product everywhere, do it from the Products tab.')}
    ${tutStep('4. Edit or delete saved records','In Products, Manufacturers and Parties, each row has Edit and Delete buttons on the right.')}
    ${tutStep('5. Finish the bill','Use View bill to check it, Save to store it without printing, or Save &amp; print to store it and open the printable invoice.')}
    ${tutStep('6. Back up your data','Everything is stored only on this device. Open Backup regularly and download a copy — Restore from file replaces all current data, so only use it with a backup you trust.')}
    <div class="mact"><button class="ghost" onclick="closeModal()">Close</button><button class="primary" onclick="startTour()">Start walkthrough</button></div>`);
}
function maybeShowTutorialOnBoot(){
  if(!localStorage.getItem(TUT_SEEN_KEY))showTutorial();
}

/* ---------- guided walkthrough ---------- */
const TOUR_STEPS=[
  {tab:'manufacturers',sel:'.secttl .mini',title:'1. Add a manufacturer',body:'Start here — add who you buy medicines from. You only do this once per manufacturer.'},
  {tab:'manufacturers',sel:'.list tr:nth-child(2) .icon',title:'Edit or delete',body:'Every row has Edit and Delete on the right.'},
  {tab:'products',sel:'.secttl .mini',title:'2. Add a product',body:'Add each medicine, pick its manufacturer, and set packing, HSN and prices.'},
  {tab:'products',sel:'.list tr:nth-child(2) .icon',title:'Edit or delete',body:'Same as manufacturers — Edit or Delete any product from its row.'},
  {tab:'parties',sel:'.secttl .mini',title:'3. Add a buyer',body:'Add the shops/distributors you sell to. Their address and GSTIN auto-fill on every bill.'},
  {tab:'parties',sel:'.list tr:nth-child(2) .icon',title:'Edit or delete',body:'Edit or Delete a buyer from their row.'},
  {tab:'bill',sel:'#f-party',title:'4. Pick the buyer',body:'Start a bill by choosing who it\'s for.'},
  {tab:'bill',sel:'.secttl .mini',title:'Add a product line',body:'Add one line per product being billed.'},
  {tab:'bill',sel:'.line select',title:'Select the product',body:'Picking a product fills in packing, HSN, MRP, PTR and PTS for you automatically.'},
  {tab:'bill',sel:'.line .stepper',title:'Qty &amp; Free',body:'Use +/− or type directly. Free quantity is not charged but is added to the total supplied.'},
  {tab:'bill',sel:'.line .del',title:'Remove a line',body:'Removes just that line from this bill — it never deletes the product itself.'},
  {tab:'bill',sel:'.tots .cdrow input',title:'Cash discount',body:'Set the discount % — it\'s applied before GST, automatically.'},
  {tab:'bill',sel:'.tots .tt',title:'Totals',body:'Gross, discount, CGST, SGST and net total all update live as you type.'},
  {tab:'bill',sel:'.actions',title:'5. Finish the bill',body:'View bill checks it, Save stores it, Save &amp; print stores it and opens the printable invoice.'}
];
let tourIdx=0;
function startTour(){closeModal();tourIdx=0;runTourStep()}
function runTourStep(){
  if(tourIdx<0)tourIdx=0;
  if(tourIdx>=TOUR_STEPS.length){endTour();return}
  const st=TOUR_STEPS[tourIdx];
  if(tab!==st.tab){tab=st.tab;render()}
  requestAnimationFrame(()=>{
    const el=document.querySelector(st.sel);
    if(!el){tourIdx++;runTourStep();return}
    showTourStep(el,st);
  });
}
function showTourStep(el,st){
  el.scrollIntoView({block:'center'});
  requestAnimationFrame(()=>{
    const r=el.getBoundingClientRect();
    const hi=document.getElementById('tourhi');
    hi.style.display='block';
    hi.style.left=(r.left-5)+'px';hi.style.top=(r.top-5)+'px';
    hi.style.width=(r.width+10)+'px';hi.style.height=(r.height+10)+'px';
    document.getElementById('tourveil').style.display='block';
    const box=document.getElementById('tourbox');
    box.innerHTML=`<div class="tb-n">Step ${tourIdx+1} of ${TOUR_STEPS.length}</div><b>${st.title}</b><p>${st.body}</p>
      <div class="tb-act">
        ${tourIdx>0?'<button class="ghost" onclick="tourIdx--;runTourStep()">Back</button>':''}
        <button class="ghost" onclick="endTour()">Skip</button>
        <button class="primary" onclick="tourIdx++;runTourStep()">${tourIdx===TOUR_STEPS.length-1?'Finish':'Next'}</button>
      </div>`;
    box.style.display='block';
    let top=r.bottom+12,left=Math.min(r.left,window.innerWidth-290);
    if(top+200>window.innerHeight)top=Math.max(10,r.top-10-box.offsetHeight);
    left=Math.max(10,left);
    box.style.top=top+'px';box.style.left=left+'px';
  });
}
function endTour(){
  document.getElementById('tourveil').style.display='none';
  document.getElementById('tourhi').style.display='none';
  document.getElementById('tourbox').style.display='none';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')endTour()});

/* ---------- util ---------- */
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- boot ---------- */
seed();migrateManufacturers();newBill();render();maybeShowTutorialOnBoot();cloudSync();
</script>
